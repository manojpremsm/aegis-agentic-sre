[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-simulator"
version = "0.1.0"
description = "Incident simulation application for Aegis"
requires-python = ">=3.11"
dependencies = [
    "aegis-contracts>=0.1.0,<0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]