[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-orchestrator"
version = "0.1.0"
description = "Incident orchestrator application for Aegis"
requires-python = ">=3.11"
dependencies = [
    "aegis-contracts>=0.1.0,<0.2.0",
     "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]